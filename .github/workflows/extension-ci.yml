name: Extension CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate extension
        run: node scripts/validate-extension.mjs

      - name: Validate hotfix scripts
        run: |
          node --check popup-fixed.js
          node --check image-fix.js
          node --check category-fix.js
