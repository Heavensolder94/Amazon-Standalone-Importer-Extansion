name: Extension CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate extension
        run: node scripts/validate-extension.mjs

      - name: Validate hotfix scripts
        run: |
          node --check popup-fixed.js
          node --check image-fix.js
          node --check category-fix.js
          node --check workflow-fix.js
          node --check description-design-fix.js
          node --check item-specifics-autofill.js
          node --check direct-ebay-bridge.js
          node --check deepseek-listing-ai.js
          node --check toast-notifications.js
          node --check batch-status-bridge.js
          node --check batch-collector.js
          node --check batch-image-fix.js

      - name: Run regression tests
        run: |
          node scripts/workflow-price-regression.test.mjs
          node scripts/batch-collector-regression.test.mjs
          node scripts/batch-image-regression.test.mjs
          node scripts/tab-toast-regression.test.mjs
